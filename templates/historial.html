<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Historial - Etoile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
  <h3 class="mb-3">Historial de Pedidos - Etoile</h3>
  
  <div class="row g-2 mb-3">
    <div class="col-md-3"><input id="f_cliente" class="form-control" placeholder="Buscar cliente"></div>
    <div class="col-md-3"><input id="f_codigo" class="form-control" placeholder="Buscar código"></div>
    <div class="col-md-2"><input id="f_desde" type="date" class="form-control"></div>
    <div class="col-md-2"><input id="f_hasta" type="date" class="form-control"></div>
    <div class="col-md-2"><button onclick="cargar()" class="btn btn-dark w-100">Buscar</button></div>
  </div>

  <div id="contenedor" class="row"></div>
</div>

<script>
async function cargar(){
  const cliente = document.getElementById('f_cliente').value
  const codigo = document.getElementById('f_codigo').value
  const desde = document.getElementById('f_desde').value
  const hasta = document.getElementById('f_hasta').value
  const url = `/api/pedidos?cliente=${cliente}&codigo=${codigo}&desde=${desde}&hasta=${hasta}`
  const res = await fetch(url)
  const data = await res.json()
  const cont = document.getElementById('contenedor')
  cont.innerHTML = ''
  if(!data.length){ cont.innerHTML = '<p class="text-muted">No hay pedidos</p>'; return }
  data.forEach(p=>{
    let itemsHtml = p.items.map(i=>`
      <tr>
        <td>${i.codigo||''}</td>
        <td>${i.prenda||''} - ${i.color||''} ${i.talla||''}</td>
        <td>${i.cant||''}</td>
        <td>$${i.precio||0}</td>
        <td>$${i.subtotal||0}</td>
      </tr>
    `).join('')
    cont.innerHTML += `
      <div class="col-12 mb-3">
        <div class="card shadow-sm">
          <div class="card-header d-flex justify-content-between">
            <b>${p.pedido_id} - ${p.cliente} - ${p.fecha}</b>
            <span>${p.metodo_pago||''} | ${p.num_transaccion||''} | Tel: ${p.telefono||''}</span>
          </div>
          <div class="card-body p-0">
            <table class="table table-sm mb-0">
              <thead><tr><th>Código</th><th>Prenda</th><th>Cant</th><th>Precio</th><th>Subtotal</th></tr></thead>
              <tbody>${itemsHtml}</tbody>
            </table>
          </div>
          <div class="card-footer d-flex justify-content-between">
            <b>Total: $${p.total.toFixed(2)}</b>
            <button onclick="eliminar('${p.pedido_id}')" class="btn btn-sm btn-danger">Eliminar pedido</button>
          </div>
        </div>
      </div>
    `
  })
}

async function eliminar(id){
  if(!confirm('¿Eliminar '+id+'?')) return
  const res = await fetch(`/api/pedidos/${id}`, {method:'DELETE'})
  const j = await res.json()
  if(j.ok){ alert('Eliminado'); cargar() } else { alert(j.error) }
}

cargar()
</script>
</body>
</html>
