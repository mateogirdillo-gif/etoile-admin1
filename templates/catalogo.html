<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Étoile</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>.card{border-radius:15px}.precio{font-weight:bold;color:#d63384}</style>
</head>
<body class="bg-light">
<div class="container py-4">
  <h2 class="text-center mb-4">Catálogo Étoile</h2>
  <input id="buscador" class="form-control mb-4" placeholder="Buscar blusa, color..." onkeyup="filtrar()">
  <div id="catalogo" class="row g-3"></div>
</div>

<script>
let TODAS = []
async function cargar(){
  const res = await fetch('/api/prendas')
  const data = await res.json()
  // tu api devuelve {ok:true, prendas:[...]} o directo [...]
  TODAS = data.prendas || data
  // QUITAR LA BASURA DEL ENCABEZADO SI AÚN APARECE
  TODAS = TODAS.filter(g => g.prenda && g.prenda.toUpperCase() !== 'PRENDA' && g.prenda.toUpperCase() !== 'CODIGO')
  render(TODAS)
}
function render(lista){
  const cont = document.getElementById('catalogo')
  cont.innerHTML = ''
  lista.forEach(grupo=>{
    // AQUÍ ESTABA TU ERROR: ANTES FILTRO POR STOCK, AHORA MUESTRA TODO
    const variantes = grupo.variantes || []
    if(variantes.length===0) return
    let varsHtml = variantes.map(v=>`
      <span class="badge bg-light text-dark border me-1 mb-1">${v.color||''} - ${v.talla||''} - $${v.precio} <br><small>${v.codigo}</small></span>
    `).join('')
    cont.innerHTML += `
      <div class="col-md-4 col-sm-6 item-prenda">
        <div class="card h-100 shadow-sm p-3">
          <h5>${grupo.prenda}</h5>
          <div class="mt-2">${varsHtml}</div>
          <button class="btn btn-dark btn-sm mt-3" onclick="pedir('${grupo.prenda}')">Pedir</button>
        </div>
      </div>
    `
  })
}
function filtrar(){
  const q = document.getElementById('buscador').value.toLowerCase()
  const filtradas = TODAS.filter(g=> g.prenda.toLowerCase().includes(q) || g.variantes.some(v=> (v.color||'').toLowerCase().includes(q) || (v.codigo||'').toLowerCase().includes(q) ))
  render(filtradas)
}
function pedir(prenda){ window.location.href = `/pedido?prenda=${encodeURIComponent(prenda)}` }
cargar()
</script>
</body>
</html>
</script>
{% endblock %}
